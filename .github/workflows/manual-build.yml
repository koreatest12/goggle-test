name: Manual Build Center

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "full"
        type: choice
        options:
          - validate
          - build
          - full
      deploy:
        description: "Deploy to GitHub Pages after a successful build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "manual-build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  manual-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-ready: ${{ steps.meta.outputs.artifact_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        if: inputs.profile == 'validate' || inputs.profile == 'full'
        run: npm run check

      - name: Build static site
        if: inputs.profile == 'build' || inputs.profile == 'full'
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify build output
        if: inputs.profile == 'build' || inputs.profile == 'full'
        run: npm run verify:build

      - name: Create build metadata
        id: meta
        shell: bash
        run: |
          mkdir -p build-meta
          {
            echo "profile=${{ inputs.profile }}"
            echo "commit=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-meta/build-info.txt

          if [[ "${{ inputs.profile }}" == "build" || "${{ inputs.profile }}" == "full" ]]; then
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: manual-build-metadata
          path: build-meta/
          retention-days: 14

      - name: Upload Pages artifact
        if: inputs.profile == 'build' || inputs.profile == 'full'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Manual Build Center"
            echo ""
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Deploy requested: \`${{ inputs.deploy }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.deploy && (inputs.profile == 'build' || inputs.profile == 'full')
    needs: manual-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
